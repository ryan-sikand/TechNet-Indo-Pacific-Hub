    <script>
      ;(() => {
        const isHosted = window.location.hostname.endsWith('.uipath.host')
        const firstSegment = window.location.pathname.split('/').filter(Boolean)[0]
        const base = isHosted && firstSegment ? `/${firstSegment}/` : window.location.protocol === 'file:' ? './' : '/'
        const element = document.createElement('base')
        element.href = base
        document.head.appendChild(element)
      })()
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
